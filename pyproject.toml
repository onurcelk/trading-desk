[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingdesk"
version = "0.1.0"
description = "Paper-trading research desk for a Paperclip-orchestrated team of AI equity analysts, backed by OpenBB market data."
requires-python = ">=3.9.21,<3.13"
dependencies = [
    "openbb>=4",
    "fastmcp>=2",
    "pandas>=2",
    "numpy>=1.26",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradingdesk = "tradingdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradingdesk = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
